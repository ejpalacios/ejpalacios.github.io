[project]
name = "ejpalacios-github-io"
version = "0.1.0"
description = "Personal page"
authors = [
    { name = "Emilio J. Palacios-Garcia", email = "epalacios-garcia@ucc.ie" },
]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pybtex>=0.24.0,<0.27"]

[dependency-groups]
dev = ["ruff>=0.15.20", "mypy>=2.1.0"]

[tool.uv]
default-groups = "all"
package = false
